# Advisories accepted for this adapter's Cargo.lock. The adapter is a
# conformance test harness, never shipped. These come from tempo-primitives and
# alloy-signer, and the same crates are accepted in conformance/adapters/rust.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste is unmaintained; transitive proc-macro dependency of alloy-primitives."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0388"
reason = "derivative is unmaintained; locked only as an optional dependency of ark-ff and never compiled."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5.5 comes from elliptic-curve 0.13 via alloy-signer, which has no release on a fixed crypto-bigint (>= 0.7.6). The adapter signs only fixed, public test keys."
