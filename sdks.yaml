version: 1
maintainers:
  - brendanjryan

canonical:
  repo: wevm/mppx

spec:
  repo: tempoxyz/mpp-specs

sdks:
  go:
    repo: tempoxyz/mpp-go
    automation: notify
    owners: [brendanjryan]
    changelog: keep-a-changelog
    verify: []

  rust:
    repo: tempoxyz/mpp-rs
    automation: pr
    owners: [brendanjryan]
    changelog: keep-a-changelog
    verify:
      - cargo test --all-features

  python:
    repo: tempoxyz/pympp
    automation: pr
    owners: [brendanjryan]
    changelog: keep-a-changelog
    verify:
      - uv sync --all-extras --dev
      - uv run pytest

  ruby:
    repo: stripe/mpp-rb
    automation: notify
    owners: []
    changelog: none
    verify: []
  java:
    repo: stripe/mpp-java
    automation: notify
    owners: []
    changelog: none
    verify: []
