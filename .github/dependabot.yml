version: 2

# Patch and minor updates are grouped per ecosystem and merge on their own
# through the Dependabot workflow once checks pass. A major update opens its
# own pull request, so a breaking release holds back only itself. Security
# updates are grouped separately, majors again on their own, are not held to
# the weekly schedule, and wait for a person to merge them.
updates:
  - package-ecosystem: "npm"
    directory: "/conformance"
    cooldown:
      default-days: 7
    # Bump reference SDK pins (bump-reference-pins.yml) owns this pin.
    ignore:
      - dependency-name: "mppx"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      weekly-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "cargo"
    directory: "/conformance/adapters/rust"
    cooldown:
      default-days: 7
    # Bump reference SDK pins (bump-reference-pins.yml) owns this pin.
    ignore:
      - dependency-name: "mpp"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      weekly-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "uv"
    directory: "/conformance/adapters/python"
    cooldown:
      default-days: 7
    # Bump reference SDK pins (bump-reference-pins.yml) owns this pin.
    ignore:
      - dependency-name: "pympp"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      weekly-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "gomod"
    directory: "/conformance/adapters/go"
    cooldown:
      default-days: 7
    # Bump reference SDK pins (bump-reference-pins.yml) owns this pin.
    ignore:
      - dependency-name: "github.com/tempoxyz/mpp-go"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      weekly-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "bundler"
    directory: "/conformance/adapters/ruby"
    cooldown:
      default-days: 7
    # Bump reference SDK pins (bump-reference-pins.yml) owns this pin.
    ignore:
      - dependency-name: "mpp-rb"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      weekly-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "gradle"
    directory: "/conformance/adapters/java"
    cooldown:
      default-days: 7
    # Bump reference SDK pins (bump-reference-pins.yml) owns this pin.
    ignore:
      - dependency-name: "com.stripe:mpp-java"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      weekly-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Tempo SDK adapters get their own groups: a bump can re-run scenarios
  # skipped with ">pinned" for gaps that are not fixed yet, and a red Tempo SDK
  # Conformance check should hold back only these bumps.
  - package-ecosystem: "npm"
    directory: "/tempo-conformance/adapters/typescript"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      tempo-sdk-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      tempo-sdk-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "cargo"
    directory: "/tempo-conformance/adapters/rust"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      tempo-sdk-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      tempo-sdk-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "uv"
    directory: "/tempo-conformance/adapters/python"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      tempo-sdk-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      tempo-sdk-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "gomod"
    directory: "/tempo-conformance/adapters/go"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      tempo-sdk-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      tempo-sdk-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      # Buffer the scanner's seven-day minimum: Dependabot reads date-only tag metadata.
      default-days: 8
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      weekly-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
