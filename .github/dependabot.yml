version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
  # Tempo SDK adapters get their own group: a bump can re-run scenarios skipped
  # with ">pinned" for gaps that are not fixed yet, and a red Tempo SDK
  # Conformance check should hold back only these bumps.
  tempo-sdk-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"

updates:
  - package-ecosystem: "npm"
    directory: "/conformance"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "cargo"
    directory: "/conformance/adapters/rust"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "uv"
    directory: "/conformance/adapters/python"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "gomod"
    directory: "/conformance/adapters/go"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "bundler"
    directory: "/conformance/adapters/ruby"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "gradle"
    directory: "/conformance/adapters/java"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "npm"
    directory: "/tempo-conformance/adapters/typescript"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "tempo-sdk-dependencies"

  - package-ecosystem: "cargo"
    directory: "/tempo-conformance/adapters/rust"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "tempo-sdk-dependencies"

  - package-ecosystem: "uv"
    directory: "/tempo-conformance/adapters/python"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "tempo-sdk-dependencies"

  - package-ecosystem: "gomod"
    directory: "/tempo-conformance/adapters/go"
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: "tempo-sdk-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      # Buffer the scanner's seven-day minimum: Dependabot reads date-only tag metadata.
      default-days: 8
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
