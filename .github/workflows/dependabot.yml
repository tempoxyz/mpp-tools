name: Dependabot

on:
  workflow_call:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# Approves Dependabot's patch and minor updates and squash-merges them once
# every check on the pull request has passed, required or not, so a red
# optional gate (such as Tempo SDK Conformance) still holds an update back.
# Majors and security updates are left for a person. The job merges
# directly instead of turning on GitHub's auto-merge: auto-merge waits only
# for required checks and stays armed after a maintainer pushes to the branch.
#
# Claude Code Review is an advisory review bot, not a gate: it can stay
# pending for many minutes, so the wait ignores it. A run that times out or
# sees a failure exits; Dependabot's next rebase or a re-run tries again.
#
# The approve and merge steps authenticate with a short-lived GitHub App
# token minted via github-sts (authorized by .github/sts/dependabot.sts.yaml
# in the repository the workflow runs against) rather than the built-in
# GITHUB_TOKEN, which is not allowed to approve pull requests. The built-in
# token keeps read scopes for the check-watching step; id-token lets the job
# request the OIDC token the STS exchange verifies. workflow_call callers
# must grant these same permissions and carry their own dependabot STS
# policy.
permissions: {}

concurrency:
  group: dependabot-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Read Dependabot metadata
        id: metadata
        uses: tempoxyz/gh-actions/vendor/dependabot/fetch-metadata@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      # Merge only patch and minor version updates. Security updates skip
      # Dependabot's cooldown, so a release hours old could otherwise land
      # with nobody looking: leave them, like majors, for a person. Callers
      # keep security fixes in groups whose names end in "security".
      - name: Decide whether to merge
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
        run: |
          merge=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) merge=true ;;
          esac
          case "$GROUP" in
            *security) merge=false; echo "Security update: left for a person" ;;
          esac
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

      - name: Wait for checks
        if: >-
          steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          previous_signature=""
          stable_passes=0

          # Up to an hour, one API call every 30 seconds, so a Monday batch of
          # waits stays inside the repository's GITHUB_TOKEN quota. A new push
          # cancels this run (concurrency above), and the merge step's
          # --match-head-commit refuses a head that moved, so the loop does
          # not re-read the head itself.
          for _ in $(seq 1 120); do
            set +e
            checks=$(gh pr checks "$PR_URL" --json bucket,name,workflow)
            check_status=$?
            set -e
            if [ "$check_status" -ne 0 ] && [ "$check_status" -ne 8 ]; then
              exit "$check_status"
            fi

            relevant=$(jq '[.[] | select(.workflow != "Dependabot" and .name != "Claude Code Review")]' <<<"$checks")
            count=$(jq 'length' <<<"$relevant")
            failures=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$relevant")
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$relevant")
            signature=$(jq -r '[.[] | (.workflow + "/" + .name)] | sort | join("\n")' <<<"$relevant")

            if [ "$failures" -gt 0 ]; then
              echo "At least one pull request check failed or was cancelled"
              jq . <<<"$relevant"
              exit 1
            fi

            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
              if [ "$signature" = "$previous_signature" ]; then
                stable_passes=$((stable_passes + 1))
              else
                stable_passes=1
              fi

              if [ "$stable_passes" -ge 3 ]; then
                jq . <<<"$relevant"
                exit 0
              fi
            else
              stable_passes=0
            fi

            previous_signature="$signature"
            sleep 30
          done

          echo "Timed out waiting for pull request checks"
          exit 1

      - name: Fetch GitHub token via STS
        if: >-
          steps.decide.outputs.merge == 'true'
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: dependabot

      - name: Approve update
        if: >-
          steps.decide.outputs.merge == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve

      - name: Merge update
        if: >-
          steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
