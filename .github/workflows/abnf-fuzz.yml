name: ABNF Differential Fuzzing

# Generates WWW-Authenticate, Authorization, Payment-Receipt and Accept-Payment
# values from the ABNF in tempoxyz/mpp-specs (scripts/abnf_fuzz.py), sends them
# to the pinned adapters, and reports adapters that disagree with the grammar or
# with mppx. Pull requests run a small report-only pass. The nightly run keeps
# one open issue (label abnf-fuzz-disagreement), updated while adapters
# disagree and closed once they agree.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/actions/setup-conformance/**
      - .github/workflows/abnf-fuzz.yml
      - conformance/adapters/**
      - conformance/fuzz/**
      - conformance/golden/**
      - conformance/package-lock.json
      - conformance/pyproject.toml
      - conformance/scripts/abnf_fuzz.py
      - conformance/scripts/diff_fuzz.py
      - conformance/scripts/harness.py
      - conformance/uv.lock
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per header kind.
        required: false
        default: "400"
      seed:
        description: Seed for case generation.
        required: false
        default: "0"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: ABNF differential fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: conformance
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout mpp-specs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/mpp-specs
          path: mpp-specs
          persist-credentials: false

      - name: Setup Rust and Node.js
        uses: ./.github/actions/setup-conformance # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          adapter: rust
          setup-node: "true"

      - name: Setup Go
        uses: ./.github/actions/setup-conformance # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          adapter: go

      - name: Install adapters
        run: make install-runner install-python install-go install-rust

      - name: Run ABNF differential fuzzing
        id: fuzz
        env:
          EVENT_NAME: ${{ github.event_name }}
          CASES: ${{ inputs.cases || '400' }}
          SEED: ${{ inputs.seed || '0' }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            set -- --cases 60 --report-only
          else
            set -- --cases "$CASES" --seed "$SEED"
          fi
          status=0
          uv run --locked python scripts/abnf_fuzz.py --specs ../mpp-specs --adapters python,go,rust "$@" \
            --report abnf-fuzz-report.json --summary abnf-fuzz-summary.md || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -f abnf-fuzz-summary.md ]; then
            cat abnf-fuzz-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abnf-fuzz-report
          path: |
            conformance/abnf-fuzz-report.json
            conformance/abnf-fuzz-summary.md
          if-no-files-found: warn

      - name: Mint issue token
        id: sts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: abnf-fuzz

      - name: Open, update, or close the disagreement issue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.fuzz.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create abnf-fuzz-disagreement --color B60205 --description "Adapters disagree with the spec ABNF" --force
          existing=$(gh issue list --label abnf-fuzz-disagreement --state open --limit 1 --json number -q '.[0].number // empty')
          if [ "$STATUS" = 0 ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Adapters agree with the ABNF again: $RUN_URL"
            fi
            exit 0
          fi
          {
            if [ -f abnf-fuzz-summary.md ]; then
              head -c 60000 abnf-fuzz-summary.md
            else
              echo "ABNF differential fuzzing failed before writing a summary."
            fi
            echo
            echo "**Run:** $RUN_URL"
          } > issue-body.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "Adapters disagree with the spec ABNF" --body-file issue-body.md --label abnf-fuzz-disagreement
          fi

      - name: Fail on disagreement
        if: steps.fuzz.outputs.status != '0'
        env:
          STATUS: ${{ steps.fuzz.outputs.status }}
        run: |
          echo "abnf_fuzz.py exited with $STATUS; see the summary." >&2
          exit 1
