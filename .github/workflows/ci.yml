name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - ledger/**
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agricola-tests:
    name: Agricola tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          version: "0.9.26"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Agricola development environment
        run: uv sync --locked --group dev

      - name: Check Agricola formatting
        run: uv run --locked ruff format --check agricola

      - name: Lint Agricola
        run: uv run --locked ruff check agricola

      - name: Type-check Agricola
        run: uv run --locked ty check agricola

      - name: Run Agricola tests with coverage
        run: |
          uv run --locked coverage run -m unittest discover -s agricola/tests -v
          uv run --locked coverage report

      - name: Validate Agricola state
        run: uv run --locked agricola validate

      - name: Lint Agricola workflows
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          .github/workflows/agricola.yml
          .github/workflows/agricola-audit.yml
          .github/workflows/ci.yml

  script-tests:
    name: Python script tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conformance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: conformance/uv.lock

      - name: Install runner dependencies
        run: uv sync --locked

      - name: Run script tests
        run: uv run --locked python -m unittest discover -s scripts -p "test_*.py"
