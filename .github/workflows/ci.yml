name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agricola-tests:
    name: Agricola tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Agricola
        run: pip install .

      - name: Run Agricola tests
        run: python -m unittest discover -s agricola/tests -v

      - name: Validate Agricola state
        run: agricola validate

  script-tests:
    name: Python script tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conformance

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: conformance/uv.lock

      - name: Install runner dependencies
        run: uv sync --locked

      - name: Run script tests
        run: uv run --locked python -m unittest discover -s scripts -p "test_*.py"
