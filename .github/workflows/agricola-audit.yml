name: Agricola SDK audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agricola-control-plane
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      canonical-repo: ${{ steps.matrix.outputs.canonical-repo }}
      canonical-sha: ${{ steps.matrix.outputs.canonical-sha }}
      spec-repo: ${{ steps.matrix.outputs.spec-repo }}
      spec-sha: ${{ steps.matrix.outputs.spec-sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build audit matrix
        id: matrix
        run: |
          pip install .
          matrix="$(agricola audit-matrix | jq -c .)"
          canonical_repo="$(python -c 'from agricola.manifest import load_manifest; print(load_manifest().canonical.repo)')"
          spec_repo="$(python -c 'from agricola.manifest import load_manifest; print(load_manifest().spec.repo)')"
          canonical_sha="$(git ls-remote "https://github.com/${canonical_repo}.git" HEAD | cut -f1)"
          spec_sha="$(git ls-remote "https://github.com/${spec_repo}.git" HEAD | cut -f1)"
          test -n "$canonical_sha"
          test -n "$spec_sha"
          {
            echo "matrix=$matrix"
            echo "canonical-repo=$canonical_repo"
            echo "canonical-sha=$canonical_sha"
            echo "spec-repo=$spec_repo"
            echo "spec-sha=$spec_sha"
          } >> "$GITHUB_OUTPUT"

  canonical:
    name: audit (typescript reference)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout audit control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout canonical SDK head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.canonical-repo }}
          ref: ${{ needs.prepare.outputs.canonical-sha }}
          path: .audit/sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Setup conformance adapter
        uses: ./.github/actions/setup-conformance
        with:
          adapter: typescript

      - name: Install audit and conformance runner
        run: |
          pip install .
          uv sync --locked --project conformance --python 3.12

      - name: Point adapter at canonical checkout
        run: |
          uv run --locked --project conformance python conformance/scripts/use_local_sdk.py \
            --adapter typescript \
            --sdk-path .audit/sdk

      - name: Build canonical SDK and adapter
        run: |
          corepack enable
          cd .audit/sdk
          pnpm install --frozen-lockfile
          pnpm build
          cd ../../conformance
          npm install

      - name: Run canonical vectors
        run: |
          set +e
          uv run --locked --project conformance python conformance/scripts/vector_runner.py \
            --adapter typescript \
            --output json \
            > "$RUNNER_TEMP/canonical-results.json"
          status=$?
          set -e
          echo "Canonical vector runner exited $status"

      - name: Build canonical snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          agricola audit-snapshot \
            --target typescript \
            --repo "${{ needs.prepare.outputs.canonical-repo }}" \
            --sha "$(git -C .audit/sdk rev-parse HEAD)" \
            --adapter-manifest conformance/adapters/typescript/adapter.json \
            --results "$RUNNER_TEMP/canonical-results.json" \
            > "$RUNNER_TEMP/snapshots/typescript.json"

      - name: Upload canonical snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agricola-audit-snapshot-typescript
          path: ${{ runner.temp }}/snapshots/typescript.json
          if-no-files-found: warn

  target:
    name: audit (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout audit control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout SDK head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          path: .audit/sdk
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical SDK head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.canonical-repo }}
          ref: ${{ needs.prepare.outputs.canonical-sha }}
          path: .audit/canonical
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout specification head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.spec-repo }}
          ref: ${{ needs.prepare.outputs.spec-sha }}
          path: .audit/spec
          fetch-depth: 1
          persist-credentials: false

      - name: Setup conformance adapter
        uses: ./.github/actions/setup-conformance
        with:
          adapter: ${{ matrix.target }}
          ruby-bundler-cache: "false"

      - name: Install audit and conformance runner
        run: |
          pip install .
          uv sync --locked --project conformance --python 3.12

      - name: Build Java SDK checkout
        if: matrix.target == 'java'
        working-directory: .audit/sdk
        run: ./gradlew --no-daemon jar

      - name: Point adapter at SDK checkout
        run: |
          uv run --locked --project conformance python conformance/scripts/use_local_sdk.py \
            --adapter "${{ matrix.target }}" \
            --sdk-path .audit/sdk

      - name: Run SDK vectors
        run: |
          set +e
          uv run --locked --project conformance python conformance/scripts/vector_runner.py \
            --adapter "${{ matrix.target }}" \
            --output json \
            > .audit/vector-results.json
          status=$?
          set -e
          echo "${{ matrix.target }} vector runner exited $status"

      - name: Prepare semantic review
        run: |
          jq -n \
            --arg target "${{ matrix.target }}" \
            --arg canonical_repo "${{ needs.prepare.outputs.canonical-repo }}" \
            --arg canonical_sha "$(git -C .audit/canonical rev-parse HEAD)" \
            --arg target_repo "${{ matrix.repo }}" \
            --arg target_sha "$(git -C .audit/sdk rev-parse HEAD)" \
            '{target: $target, canonical_repo: $canonical_repo, canonical_sha: $canonical_sha, target_repo: $target_repo, target_sha: $target_sha}' \
            > .audit/context.json
          agricola audit-semantic-schema > .audit/semantic-output.schema.json

      - name: Compare SDK implementation to canonical mppx
        id: semantic
        continue-on-error: true
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/agricola/audit.md
          output-file: .audit/semantic-result.json
          output-schema-file: .audit/semantic-output.schema.json
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          model: gpt-5.6-sol
          codex-args: '["--ephemeral"]'

      - name: Build SDK snapshot
        env:
          SEMANTIC_OUTCOME: ${{ steps.semantic.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          semantic_args=(
            --semantic-error
            "${{ matrix.target }}: semantic review action ${SEMANTIC_OUTCOME}"
          )
          if [ "$SEMANTIC_OUTCOME" = success ] && [ -s .audit/semantic-result.json ]; then
            semantic_args=(--semantic-results .audit/semantic-result.json)
          fi
          agricola audit-snapshot \
            --target "${{ matrix.target }}" \
            --repo "${{ matrix.repo }}" \
            --sha "$(git -C .audit/sdk rev-parse HEAD)" \
            --canonical-sha "$(git -C .audit/canonical rev-parse HEAD)" \
            --adapter-manifest "conformance/adapters/${{ matrix.target }}/adapter.json" \
            --results .audit/vector-results.json \
            "${semantic_args[@]}" \
            > "$RUNNER_TEMP/snapshots/${{ matrix.target }}.json"

      - name: Upload SDK snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agricola-audit-snapshot-${{ matrix.target }}
          path: ${{ runner.temp }}/snapshots/${{ matrix.target }}.json
          if-no-files-found: warn

  report:
    needs: [prepare, canonical, target]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      STATE_BRANCH: agricola/state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Restore control-plane state
        run: |
          if git fetch origin "refs/heads/$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"; then
            git restore --source "origin/$STATE_BRANCH" -- ledger
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Agricola
        run: pip install .

      - name: Download audit snapshots
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agricola-audit-snapshot-*
          path: ${{ runner.temp }}/snapshots
          merge-multiple: true

      - name: Build audit roll-up
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          agricola build-audit "$RUNNER_TEMP/snapshots" \
            --report-file "$RUNNER_TEMP/audit-report.json"
          cat "$RUNNER_TEMP/audit-report.json"

      - name: Persist audit registry
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: ${{ env.DEFAULT_BRANCH }}
          branch: ${{ env.STATE_BRANCH }}
          commit-message: "chore(agricola): update state"
          title: "chore(agricola): update state"
          body: |
            > [!IMPORTANT]
            > This pull request is maintained by automation. Merge it to checkpoint state on the default branch; do not close or edit it manually.

            ## Motivation

            Persist Agricola's durable cursor, decisions, and audit finding registry through the repository's required pull-request path.

            ## Summary

            - tracks the latest processed canonical merge
            - records immutable source snapshots and maintainer decisions
            - assigns stable IDs to recurring audit findings

            ## Key design considerations

            - workflow code always executes from the protected default branch
            - this pull request is updated in place as state advances
          add-paths: ledger
          delete-branch: true

      - name: Create control repository token
        id: control-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: tempoxyz
          repositories: mpp-tools
          permission-issues: write

      - name: Reconcile audit issues
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
        run: agricola deliver-audit "$RUNNER_TEMP/audit-report.json"

      - name: Require complete audit
        run: jq -e '.healthy == true' "$RUNNER_TEMP/audit-report.json" >/dev/null
