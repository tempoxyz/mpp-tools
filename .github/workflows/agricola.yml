name: Agricola control plane

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agricola-control-plane
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/ag')
    runs-on: ubuntu-latest
    outputs:
      has-propagations: ${{ steps.process.outputs.has-propagations }}
      propagation-matrix: ${{ steps.process.outputs.propagation-matrix }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      STATE_BRANCH: agricola/state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Restore control-plane state
        run: |
          if git fetch origin "refs/heads/$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"; then
            git restore --source "origin/$STATE_BRANCH" -- ledger
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and validate Agricola
        run: |
          pip install .
          agricola validate

      - name: Create control repository token
        id: control-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: tempoxyz
          repositories: mpp-tools
          permission-issues: write

      - name: Create canonical repository token
        id: canonical-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: wevm
          repositories: mppx
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Create downstream repository read token
        if: github.event_name == 'issue_comment'
        id: downstream-read-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: tempoxyz
          repositories: |
            mpp-rs
            pympp
          permission-contents: read
          permission-pull-requests: read

      - name: Process event
        id: process
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
          AGRICOLA_CANONICAL_TOKEN: ${{ steps.canonical-token.outputs.token }}
          AGRICOLA_SDK_TOKEN: ${{ steps.downstream-read-token.outputs.token }}
        run: |
          result="$RUNNER_TEMP/agricola-result.json"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            agricola handle-comment \
              --reply-file "$RUNNER_TEMP/agricola-reply.json" \
              --issue-update-file "$RUNNER_TEMP/agricola-issue-update.json" \
              > "$result"
          else
            agricola poll > "$result"
          fi
          cat "$result"
          jq -c '{include: [.propagations[] | {request: .}]}' "$result" \
            | sed 's/^/propagation-matrix=/' >> "$GITHUB_OUTPUT"
          if jq -e '.propagations | length > 0' "$result" >/dev/null; then
            echo "has-propagations=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-propagations=false" >> "$GITHUB_OUTPUT"
          fi
          if jq -e '.commands > 0 and (.ignored | not)' "$result" >/dev/null; then
            echo "accepted-command=true" >> "$GITHUB_OUTPUT"
          else
            echo "accepted-command=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Acknowledge accepted command
        if: github.event_name == 'issue_comment' && steps.process.outputs.accepted-command == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Persist control-plane state
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: ${{ env.DEFAULT_BRANCH }}
          branch: ${{ env.STATE_BRANCH }}
          commit-message: "chore(agricola): update state"
          title: "chore(agricola): update state"
          body: |
            > [!IMPORTANT]
            > This pull request is maintained by automation. Merge it to checkpoint state on the default branch; do not close or edit it manually.

            ## Motivation

            Persist Agricola's durable cursor and decision ledger through the repository's required pull-request path.

            ## Summary

            - tracks the latest processed canonical merge
            - records immutable source snapshots and maintainer decisions

            ## Key design considerations

            - workflow code always executes from the protected default branch
            - this pull request is updated in place as state advances
          add-paths: ledger
          delete-branch: true

      - name: Deliver command reply
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
        run: |
          if [ -f "$RUNNER_TEMP/agricola-issue-update.json" ]; then
            agricola deliver-issue-update "$RUNNER_TEMP/agricola-issue-update.json"
          fi
          if [ -f "$RUNNER_TEMP/agricola-reply.json" ]; then
            agricola deliver-reply "$RUNNER_TEMP/agricola-reply.json"
          fi

  generate:
    name: generate (${{ matrix.request.target }})
    needs: run
    if: needs.run.outputs.has-propagations == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.run.outputs.propagation-matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout downstream SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.request.target_repo }}
          ref: ${{ matrix.request.revision && matrix.request.revision.head_sha || matrix.request.target_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Agricola prompt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .agricola/control
          persist-credentials: false

      - name: Prepare generation context
        env:
          REQUEST_JSON: ${{ toJSON(matrix.request) }}
        run: |
          printf '%s\n' "$REQUEST_JSON" > .agricola/request.json
          echo .agricola/ >> .git/info/exclude
          source_repo="$(jq -r .source.repo .agricola/request.json)"
          source_sha="$(jq -r .source.sha .agricola/request.json)"
          git clone --filter=blob:none "https://github.com/${source_repo}.git" .agricola/canonical
          git -C .agricola/canonical checkout --detach "$source_sha"
          git clone --depth 1 https://github.com/tempoxyz/mpp-specs.git .agricola/spec

      - name: Create revision feedback token
        if: matrix.request.revision != null
        id: revision-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: tempoxyz
          repositories: |
            mpp-rs
            pympp
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Collect revision feedback
        if: matrix.request.revision != null
        env:
          GH_TOKEN: ${{ steps.revision-token.outputs.token }}
        run: |
          pip install .agricola/control
          agricola collect-revision-feedback .agricola/request.json \
            --output .agricola/revision.md

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.26"

      - name: Generate downstream changes
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .agricola/control/.github/agricola/propagate.md
          output-file: .agricola/codex-output.md
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          model: gpt-5.6-sol
          codex-args: '["--ephemeral"]'

      - name: Capture generated patch
        run: |
          git add --all
          if git diff --cached --quiet --; then
            if [ "$(jq -r '.revision != null' .agricola/request.json)" = "true" ]; then
              echo "Codex produced no revision changes" >&2
              exit 1
            fi
            reason="$(sed -n 's/^AGRICOLA_SKIP: //p' .agricola/codex-output.md | tail -n 1)"
            if [ -z "$reason" ]; then
              echo "Codex produced no downstream changes or explicit skip reason" >&2
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/results"
            jq -n \
              --slurpfile request .agricola/request.json \
              --arg outcome skipped \
              --arg reason "$reason" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{outcome: $outcome, request: $request[0], reason: $reason, at: $at}' \
              > "$RUNNER_TEMP/results/${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}.json"
            : > "$RUNNER_TEMP/changes.patch"
          else
            git diff --cached --binary --output="$RUNNER_TEMP/changes.patch" --
          fi
          if [ "$(jq -r '.revision != null' .agricola/request.json)" = "true" ]; then
            summary="$(sed -n 's/^AGRICOLA_SUMMARY: //p' .agricola/codex-output.md | tail -n 1)"
            if [ -z "$summary" ]; then
              echo "Codex produced no revision summary" >&2
              exit 1
            fi
            printf '%s\n' "$summary" > "$RUNNER_TEMP/revision-summary.txt"
            git diff --cached --stat -- > "$RUNNER_TEMP/revision-stat.txt"
          fi

      - name: Upload generated patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agricola-patch-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error

      - name: Upload explicit skip result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agricola-result-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/results/*.json
          if-no-files-found: ignore

      - name: Upload revision summary
        if: matrix.request.revision != null
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agricola-summary-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: |
            ${{ runner.temp }}/revision-summary.txt
            ${{ runner.temp }}/revision-stat.txt
          if-no-files-found: error

  verify:
    name: verify (${{ matrix.request.target }})
    needs: [run, generate]
    if: needs.run.outputs.has-propagations == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.run.outputs.propagation-matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout downstream SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.request.target_repo }}
          ref: ${{ matrix.request.revision && matrix.request.revision.head_sha || matrix.request.target_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Agricola
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .agricola/control
          persist-credentials: false

      - name: Download generated patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agricola-patch-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/patch

      - name: Inspect generated patch
        id: patch
        run: |
          if [ -s "$RUNNER_TEMP/patch/changes.patch" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply generated patch
        if: steps.patch.outputs.has-changes == 'true'
        env:
          REQUEST_JSON: ${{ toJSON(matrix.request) }}
        run: |
          printf '%s\n' "$REQUEST_JSON" > .agricola/request.json
          git apply --index "$RUNNER_TEMP/patch/changes.patch"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.patch.outputs.has-changes == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .agricola/control/pyproject.toml

      - name: Setup uv
        if: steps.patch.outputs.has-changes == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.26"

      - name: Run manifest verification
        if: steps.patch.outputs.has-changes == 'true'
        run: |
          pip install .agricola/control
          agricola verify-propagation .agricola/request.json

  publish:
    name: publish (${{ matrix.request.target }})
    needs: [run, verify]
    if: needs.run.outputs.has-propagations == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.run.outputs.propagation-matrix) }}
    permissions:
      contents: read
    steps:
      - name: Download verified patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agricola-patch-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/patch

      - name: Download revision summary
        if: matrix.request.revision != null
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agricola-summary-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/summary

      - name: Inspect verified patch
        id: patch
        run: |
          if [ -s "$RUNNER_TEMP/patch/changes.patch" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create downstream repository token
        if: steps.patch.outputs.has-changes == 'true'
        id: downstream-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: tempoxyz
          repositories: |
            mpp-rs
            pympp
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout downstream SDK
        if: steps.patch.outputs.has-changes == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.request.target_repo }}
          ref: ${{ matrix.request.revision && matrix.request.revision.head_sha || matrix.request.target_base_sha }}
          token: ${{ steps.downstream-token.outputs.token }}
          fetch-depth: 0

      - name: Checkout Agricola
        if: steps.patch.outputs.has-changes == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .agricola/control
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.patch.outputs.has-changes == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .agricola/control/pyproject.toml

      - name: Prepare downstream commit
        if: steps.patch.outputs.has-changes == 'true'
        env:
          REQUEST_JSON: ${{ toJSON(matrix.request) }}
        run: |
          printf '%s\n' "$REQUEST_JSON" > .agricola/request.json
          git apply --index "$RUNNER_TEMP/patch/changes.patch"
          pip install .agricola/control
          agricola render-propagation .agricola/request.json \
            --title-file "$RUNNER_TEMP/pr-title.txt" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          git config user.name "${{ steps.downstream-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.downstream-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          if [ "$(jq -r '.revision != null' .agricola/request.json)" = "true" ]; then
            {
              cat "$RUNNER_TEMP/pr-title.txt"
              echo
              printf 'Agricola-Request: %s\n' "$(jq -r .idempotency_key .agricola/request.json)"
              printf 'Agricola-Summary: %s\n' "$(tr -d '\n' < "$RUNNER_TEMP/summary/revision-summary.txt")"
            } > "$RUNNER_TEMP/commit-message.txt"
            git commit -F "$RUNNER_TEMP/commit-message.txt"
          else
            git commit -F "$RUNNER_TEMP/pr-title.txt"
          fi

      - name: Create or update draft pull request
        if: steps.patch.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ steps.downstream-token.outputs.token }}
        run: |
          repo="$(jq -r .target_repo .agricola/request.json)"
          branch="$(jq -r .branch .agricola/request.json)"
          owner="${repo%%/*}"
          candidates="$(gh api --method GET "repos/$repo/pulls" \
            -f state=all -f head="$owner:$branch" -f per_page=100)"
          existing="$(jq -c --arg repo "$repo" \
            '[.[] | select(.head.repo.full_name == $repo)][0] // {}' \
            <<< "$candidates")"
          state="$(jq -r 'if .merged_at then "MERGED" else (.state // "" | ascii_upcase) end' \
            <<< "$existing")"
          expected_pr="$(jq -r '.revision.pr // empty' .agricola/request.json)"
          if [ -n "$expected_pr" ] && [ "$expected_pr" != "$repo#$(jq -r .number <<< "$existing")" ]; then
            echo "Recorded revision PR does not match the stable branch" >&2
            exit 1
          fi
          if [ -n "$expected_pr" ] && [ "$state" != "OPEN" ]; then
            echo "Recorded revision PR is no longer open" >&2
            exit 1
          fi
          if [ "$state" = "MERGED" ]; then
            url="$(jq -r .html_url <<< "$existing")"
            number="$(jq -r .number <<< "$existing")"
          elif [ "$state" = "CLOSED" ]; then
            echo "Existing Agricola PR is closed; use retry after reopening it" >&2
            exit 1
          else
            if [ "$state" = "OPEN" ] && [ "$(jq -r .draft <<< "$existing")" != "true" ]; then
              gh pr ready --undo "$(jq -r .number <<< "$existing")" --repo "$repo"
            fi
            revision_head="$(jq -r '.revision.head_sha // empty' .agricola/request.json)"
            if [ -n "$revision_head" ]; then
              request_key="$(jq -r .idempotency_key .agricola/request.json)"
              git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
              remote="$(git rev-parse "refs/remotes/origin/$branch")"
              if [ "$remote" = "$revision_head" ]; then
                git push origin "HEAD:refs/heads/$branch"
              else
                if ! git merge-base --is-ancestor "$revision_head" "$remote"; then
                  echo "Revision branch no longer descends from the recorded PR head" >&2
                  exit 1
                fi
                published_commit=""
                while IFS= read -r candidate; do
                  candidate_key="$(git show -s \
                    --format='%(trailers:key=Agricola-Request,valueonly)' "$candidate")"
                  if [ "$candidate_key" = "$request_key" ]; then
                    published_commit="$candidate"
                    break
                  fi
                done < <(git rev-list "$revision_head..$remote")
                if [ -z "$published_commit" ]; then
                  echo "Revision branch changed before publication" >&2
                  exit 1
                fi
                git show -s --format='%(trailers:key=Agricola-Summary,valueonly)' \
                  "$published_commit" > "$RUNNER_TEMP/summary/revision-summary.txt"
                if [ ! -s "$RUNNER_TEMP/summary/revision-summary.txt" ]; then
                  echo "Published revision has no stored summary" >&2
                  exit 1
                fi
                git show --stat --format= --no-renames "$published_commit" \
                  > "$RUNNER_TEMP/summary/revision-stat.txt"
                echo "Revision was already published; resuming post-push steps"
              fi
            elif remote="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)" && [ -n "$remote" ]; then
              git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
              git push --force-with-lease="refs/heads/$branch:$remote" origin "HEAD:refs/heads/$branch"
            else
              git push origin "HEAD:refs/heads/$branch"
            fi
            if [ "$state" = "OPEN" ]; then
              url="$(jq -r .html_url <<< "$existing")"
              number="$(jq -r .number <<< "$existing")"
            else
              url="$(gh pr create --repo "$repo" --head "$branch" --draft \
                --title "$(tr -d '\n' < "$RUNNER_TEMP/pr-title.txt")" \
                --body-file "$RUNNER_TEMP/pr-body.md")"
              number="$(gh pr view "$url" --repo "$repo" --json number --jq .number)"
            fi
          fi
          if [ -n "$expected_pr" ]; then
            request_key="$(jq -r .idempotency_key .agricola/request.json)"
            marker="<!-- agricola:revision-summary:$request_key -->"
            {
              echo "$marker"
              echo 'Agricola updated this pull request from the latest review feedback and failing CI.'
              echo
              echo '### Summary of changes'
              echo
              sed 's/^/- /' "$RUNNER_TEMP/summary/revision-summary.txt"
              echo
              echo '### Changed files'
              echo
              echo '```text'
              cat "$RUNNER_TEMP/summary/revision-stat.txt"
              echo '```'
              echo
              echo "Requested from ${{ matrix.request.tracking_issue_url }}."
            } > "$RUNNER_TEMP/revision-comment.md"
            already_commented="$(
              gh api --paginate "repos/$repo/issues/$number/comments?per_page=100" |
                jq -s --arg marker "$marker" \
                  'add | any(.[]; (.body // "") | contains($marker))'
            )"
            if [ "$already_commented" != "true" ]; then
              gh pr comment "$number" --repo "$repo" \
                --body-file "$RUNNER_TEMP/revision-comment.md"
            fi
          fi
          mkdir -p "$RUNNER_TEMP/results"
          jq -n \
            --slurpfile request .agricola/request.json \
            --arg outcome published \
            --arg pr "$repo#$number" \
            --arg url "$url" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{outcome: $outcome, request: $request[0], pr: $pr, url: $url, at: $at}' \
            > "$RUNNER_TEMP/results/${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}.json"

      - name: Upload propagation result
        if: steps.patch.outputs.has-changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agricola-result-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/results/*.json
          if-no-files-found: error

  record:
    needs: [run, publish]
    if: always() && needs.run.result == 'success' && needs.run.outputs.has-propagations == 'true'
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      STATE_BRANCH: agricola/state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Restore control-plane state
        run: |
          if git fetch origin "refs/heads/$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"; then
            git restore --source "origin/$STATE_BRANCH" -- ledger
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Agricola
        run: pip install .

      - name: Download propagation results
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agricola-result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Record propagation decisions
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          agricola record-propagations "$RUNNER_TEMP/results" \
            --reply-directory "$RUNNER_TEMP/replies" \
            --issue-update-directory "$RUNNER_TEMP/issue-updates"

      - name: Persist propagation decisions
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: ${{ env.DEFAULT_BRANCH }}
          branch: ${{ env.STATE_BRANCH }}
          commit-message: "chore(agricola): update state"
          title: "chore(agricola): update state"
          body: |
            > [!IMPORTANT]
            > This pull request is maintained by automation. Merge it to checkpoint state on the default branch; do not close or edit it manually.

            ## Motivation

            Persist Agricola's durable cursor and decision ledger through the repository's required pull-request path.

            ## Summary

            - tracks the latest processed canonical merge
            - records immutable source snapshots and maintainer decisions

            ## Key design considerations

            - workflow code always executes from the protected default branch
            - this pull request is updated in place as state advances
          add-paths: ledger
          delete-branch: true

      - name: Create control repository token
        id: control-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: tempoxyz
          repositories: mpp-tools
          permission-issues: write

      - name: Update tracking issues and deliver publication replies
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
        run: |
          for update in "$RUNNER_TEMP"/issue-updates/*.json; do
            [ -e "$update" ] || continue
            agricola deliver-issue-update "$update"
          done
          for reply in "$RUNNER_TEMP"/replies/*.json; do
            [ -e "$reply" ] || continue
            agricola deliver-reply "$reply"
          done
