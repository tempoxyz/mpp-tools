name: Agricola control plane

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]

# contents: write lets `agricola state-transaction` push the agricola/state
# branch with the checkout credentials (branch pushes stay on the built-in
# token). The state pull request itself is opened with a short-lived GitHub
# App token minted via github-sts (authorized by
# .github/sts/agricola-state.sts.yaml) because the built-in GITHUB_TOKEN is
# not allowed to create pull requests. id-token lets those jobs request the
# OIDC token the STS exchange verifies.
permissions:
  contents: write
  id-token: write

concurrency:
  # Fixes are isolated by tracking issue. Ignored comments use unique groups so
  # bot replies cannot replace pending commands.
  group: >-
    agricola-${{ github.event_name == 'issue_comment'
    && contains(github.event.comment.body, '/ag')
    && format('fix-{0}', github.event.issue.number)
    || github.event_name == 'issue_comment'
    && format('ignored-{0}', github.event.comment.id)
    || 'control-plane' }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/ag')
    runs-on: ubuntu-latest
    outputs:
      has-propagations: ${{ steps.process.outputs.has-propagations }}
      propagation-matrix: ${{ steps.process.outputs.propagation-matrix }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      STATE_BRANCH: agricola/state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Agricola
        uses: ./.github/actions/setup-agricola

      - name: Resolve downstream token scope
        id: downstream-scope
        run: |
          scope="$(agricola token-scope)"
          echo "owner=$(jq -r .owner <<< "$scope")" >> "$GITHUB_OUTPUT"
          {
            echo 'repositories<<EOF'
            jq -r '.repositories[]' <<< "$scope"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create control repository token
        id: control-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: tempoxyz
          repositories: mpp-tools
          permission-issues: write

      - name: Create canonical repository token
        id: canonical-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: wevm
          repositories: mppx
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Create downstream repository read token
        if: github.event_name == 'issue_comment'
        id: downstream-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: ${{ steps.downstream-scope.outputs.owner }}
          repositories: ${{ steps.downstream-scope.outputs.repositories }}
          permission-contents: read
          permission-pull-requests: read

      - name: Process event
        id: process
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
          AGRICOLA_CANONICAL_TOKEN: ${{ steps.canonical-token.outputs.token }}
          AGRICOLA_SDK_TOKEN: ${{ steps.downstream-read-token.outputs.token }}
        run: |
          result="$RUNNER_TEMP/agricola-result.json"
          transaction=(
            agricola state-transaction
            --branch "$STATE_BRANCH"
            --base "$DEFAULT_BRANCH"
            --
          )
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            "${transaction[@]}" agricola handle-comment \
              --reply-file "$RUNNER_TEMP/agricola-reply.json" \
              --issue-update-file "$RUNNER_TEMP/agricola-issue-update.json" \
              > "$result"
          else
            "${transaction[@]}" agricola poll > "$result"
          fi
          cat "$result"
          jq -c '{include: [.propagations[] | {
            request: .,
            owner: (.target_repo | split("/")[0]),
            repository: (.target_repo | split("/")[1])
          }]}' "$result" \
            | sed 's/^/propagation-matrix=/' >> "$GITHUB_OUTPUT"
          if jq -e '.propagations | length > 0' "$result" >/dev/null; then
            echo "has-propagations=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-propagations=false" >> "$GITHUB_OUTPUT"
          fi
          if jq -e '.commands > 0 and (.ignored | not)' "$result" >/dev/null; then
            echo "accepted-command=true" >> "$GITHUB_OUTPUT"
          else
            echo "accepted-command=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Acknowledge accepted command
        if: github.event_name == 'issue_comment' && steps.process.outputs.accepted-command == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@8819cf80bdcb39c36c34700e3f2ecc08bde54f23 # main
        with:
          policy: agricola-state

      - name: Ensure state pull request
        uses: ./.github/actions/persist-agricola-state
        with:
          token: ${{ steps.sts.outputs.token }}
          base: ${{ env.DEFAULT_BRANCH }}
          branch: ${{ env.STATE_BRANCH }}

      - name: Deliver command reply
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
          HAS_PROPAGATIONS: ${{ steps.process.outputs.has-propagations }}
        run: |
          if [ -f "$RUNNER_TEMP/agricola-issue-update.json" ]; then
            agricola deliver-issue-update "$RUNNER_TEMP/agricola-issue-update.json"
          fi
          if [ -f "$RUNNER_TEMP/agricola-reply.json" ]; then
            if [ "$HAS_PROPAGATIONS" = "true" ]; then
              agricola deliver-reply "$RUNNER_TEMP/agricola-reply.json" \
                --action-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              agricola deliver-reply "$RUNNER_TEMP/agricola-reply.json"
            fi
          fi

  generate:
    name: generate (${{ matrix.request.target }})
    needs: run
    if: needs.run.outputs.has-propagations == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.run.outputs.propagation-matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout downstream SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.request.target_repo }}
          ref: ${{ matrix.request.revision && matrix.request.revision.head_sha || matrix.request.target_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Agricola prompt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .agricola/control
          persist-credentials: false

      - name: Prepare generation context
        env:
          REQUEST_JSON: ${{ toJSON(matrix.request) }}
        run: |
          printf '%s\n' "$REQUEST_JSON" > .agricola/request.json
          echo .agricola/ >> .git/info/exclude
          source_repo="$(jq -r .source.repo .agricola/request.json)"
          source_sha="$(jq -r .source.sha .agricola/request.json)"
          git clone --filter=blob:none "https://github.com/${source_repo}.git" .agricola/canonical
          git -C .agricola/canonical checkout --detach "$source_sha"
          git clone --depth 1 https://github.com/tempoxyz/mpp-specs.git .agricola/spec

      - name: Create revision feedback token
        if: matrix.request.revision != null
        id: revision-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repository }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Setup Agricola for revision feedback
        if: matrix.request.revision != null
        uses: ./.agricola/control/.github/actions/setup-agricola
        with:
          project-path: .agricola/control

      - name: Collect revision feedback
        if: matrix.request.revision != null
        env:
          GH_TOKEN: ${{ steps.revision-token.outputs.token }}
        run: |
          agricola collect-revision-feedback .agricola/request.json \
            --output .agricola/revision.md

      - name: Setup uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          version: "0.9.26"

      - name: Generate downstream changes
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .agricola/control/.github/agricola/propagate.md
          output-file: .agricola/codex-output.md
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          model: gpt-5.6-sol
          codex-args: '["--ephemeral"]'

      - name: Capture generated patch
        run: |
          git add --all
          if git diff --cached --quiet --; then
            if [ "$(jq -r '.revision != null' .agricola/request.json)" = "true" ]; then
              echo "Codex produced no revision changes" >&2
              exit 1
            fi
            reason="$(sed -n 's/^AGRICOLA_SKIP: //p' .agricola/codex-output.md | tail -n 1)"
            if [ -z "$reason" ]; then
              echo "Codex produced no downstream changes or explicit skip reason" >&2
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/results"
            jq -n \
              --slurpfile request .agricola/request.json \
              --arg outcome skipped \
              --arg reason "$reason" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{outcome: $outcome, request: $request[0], reason: $reason, at: $at}' \
              > "$RUNNER_TEMP/results/${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}.json"
            : > "$RUNNER_TEMP/changes.patch"
          else
            git diff --cached --binary --output="$RUNNER_TEMP/changes.patch" --
          fi
          if [ "$(jq -r '.revision != null' .agricola/request.json)" = "true" ]; then
            summary="$(sed -n 's/^AGRICOLA_SUMMARY: //p' .agricola/codex-output.md | tail -n 1)"
            if [ -z "$summary" ]; then
              echo "Codex produced no revision summary" >&2
              exit 1
            fi
            printf '%s\n' "$summary" > "$RUNNER_TEMP/revision-summary.txt"
            git diff --cached --stat -- > "$RUNNER_TEMP/revision-stat.txt"
          fi

      - name: Upload generated patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agricola-patch-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error

      - name: Upload explicit skip result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agricola-result-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/results/*.json
          if-no-files-found: ignore

      - name: Upload revision summary
        if: matrix.request.revision != null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agricola-summary-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: |
            ${{ runner.temp }}/revision-summary.txt
            ${{ runner.temp }}/revision-stat.txt
          if-no-files-found: error

  verify:
    name: verify (${{ matrix.request.target }})
    needs: [run, generate]
    if: needs.run.outputs.has-propagations == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.run.outputs.propagation-matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout downstream SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.request.target_repo }}
          ref: ${{ matrix.request.revision && matrix.request.revision.head_sha || matrix.request.target_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Agricola
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .agricola/control
          persist-credentials: false

      - name: Download generated patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agricola-patch-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/patch

      - name: Inspect generated patch
        id: patch
        run: |
          if [ -s "$RUNNER_TEMP/patch/changes.patch" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply generated patch
        if: steps.patch.outputs.has-changes == 'true'
        env:
          REQUEST_JSON: ${{ toJSON(matrix.request) }}
        run: |
          printf '%s\n' "$REQUEST_JSON" > .agricola/request.json
          git apply --index "$RUNNER_TEMP/patch/changes.patch"

      - name: Setup Agricola
        if: steps.patch.outputs.has-changes == 'true'
        uses: ./.agricola/control/.github/actions/setup-agricola
        with:
          project-path: .agricola/control

      - name: Setup uv
        if: steps.patch.outputs.has-changes == 'true'
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          version: "0.9.26"

      - name: Run manifest verification
        if: steps.patch.outputs.has-changes == 'true'
        run: agricola verify-propagation .agricola/request.json

  publish:
    name: publish (${{ matrix.request.target }})
    needs: [run, verify]
    if: needs.run.outputs.has-propagations == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.run.outputs.propagation-matrix) }}
    permissions:
      contents: read
    steps:
      - name: Download verified patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agricola-patch-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/patch

      - name: Download revision summary
        if: matrix.request.revision != null
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agricola-summary-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/summary

      - name: Inspect verified patch
        id: patch
        run: |
          if [ -s "$RUNNER_TEMP/patch/changes.patch" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create downstream repository token
        if: steps.patch.outputs.has-changes == 'true'
        id: downstream-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout downstream SDK
        if: steps.patch.outputs.has-changes == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.request.target_repo }}
          ref: ${{ matrix.request.revision && matrix.request.revision.head_sha || matrix.request.target_base_sha }}
          token: ${{ steps.downstream-token.outputs.token }}
          fetch-depth: 0

      - name: Checkout Agricola
        if: steps.patch.outputs.has-changes == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .agricola/control
          persist-credentials: false

      - name: Setup Agricola
        if: steps.patch.outputs.has-changes == 'true'
        uses: ./.agricola/control/.github/actions/setup-agricola
        with:
          project-path: .agricola/control

      - name: Prepare downstream commit
        if: steps.patch.outputs.has-changes == 'true'
        env:
          REQUEST_JSON: ${{ toJSON(matrix.request) }}
        run: |
          printf '%s\n' "$REQUEST_JSON" > .agricola/request.json
          git apply --index "$RUNNER_TEMP/patch/changes.patch"
          agricola render-propagation .agricola/request.json \
            --title-file "$RUNNER_TEMP/pr-title.txt" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          git config user.name "${{ steps.downstream-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.downstream-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          if [ "$(jq -r '.revision != null' .agricola/request.json)" = "true" ]; then
            {
              cat "$RUNNER_TEMP/pr-title.txt"
              echo
              printf 'Agricola-Request: %s\n' "$(jq -r .idempotency_key .agricola/request.json)"
              printf 'Agricola-Summary: %s\n' "$(tr -d '\n' < "$RUNNER_TEMP/summary/revision-summary.txt")"
            } > "$RUNNER_TEMP/commit-message.txt"
            git commit -F "$RUNNER_TEMP/commit-message.txt"
          else
            git commit -F "$RUNNER_TEMP/pr-title.txt"
          fi

      - name: Create or update draft pull request
        if: steps.patch.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ steps.downstream-token.outputs.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          arguments=(
            .agricola/request.json
            --title-file "$RUNNER_TEMP/pr-title.txt"
            --body-file "$RUNNER_TEMP/pr-body.md"
            --output "$RUNNER_TEMP/results/${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}.json"
          )
          if [ "$(jq -r '.revision != null' .agricola/request.json)" = "true" ]; then
            arguments+=(
              --revision-summary-file "$RUNNER_TEMP/summary/revision-summary.txt"
              --revision-stat-file "$RUNNER_TEMP/summary/revision-stat.txt"
            )
          fi
          agricola publish-propagation "${arguments[@]}"

      - name: Upload propagation result
        if: steps.patch.outputs.has-changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agricola-result-${{ matrix.request.target }}-${{ matrix.request.tracking_issue }}
          path: ${{ runner.temp }}/results/*.json
          if-no-files-found: error

  record:
    needs: [run, publish]
    if: always() && needs.run.result == 'success' && needs.run.outputs.has-propagations == 'true'
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      STATE_BRANCH: agricola/state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Agricola
        uses: ./.github/actions/setup-agricola

      - name: Download propagation results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agricola-result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Record propagation decisions
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          agricola state-transaction \
            --branch "$STATE_BRANCH" \
            --base "$DEFAULT_BRANCH" \
            -- \
            agricola record-propagations "$RUNNER_TEMP/results" \
              --reply-directory "$RUNNER_TEMP/replies" \
              --issue-update-directory "$RUNNER_TEMP/issue-updates"

      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@8819cf80bdcb39c36c34700e3f2ecc08bde54f23 # main
        with:
          policy: agricola-state

      - name: Ensure state pull request
        uses: ./.github/actions/persist-agricola-state
        with:
          token: ${{ steps.sts.outputs.token }}
          base: ${{ env.DEFAULT_BRANCH }}
          branch: ${{ env.STATE_BRANCH }}

      - name: Create control repository token
        id: control-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AGRICOLA_APP_ID }}
          private-key: ${{ secrets.AGRICOLA_APP_PRIVATE_KEY }}
          owner: tempoxyz
          repositories: mpp-tools
          permission-issues: write

      - name: Update tracking issues and deliver publication replies
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
        run: |
          for update in "$RUNNER_TEMP"/issue-updates/*.json; do
            [ -e "$update" ] || continue
            agricola deliver-issue-update "$update"
          done
          for reply in "$RUNNER_TEMP"/replies/*.json; do
            [ -e "$reply" ] || continue
            agricola deliver-reply "$reply" \
              --action-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
