name: SDK Conformance Monitor

# Runs the conformance suite once a day: against the pinned SDK releases, and
# against the head of each SDK repository's default branch. SDK repositories do
# not run conformance in their own CI; a failing SDK gets one open issue here
# (label conformance-failure), updated while it fails and closed once it passes.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  conformance:
    uses: ./.github/workflows/conformance.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      contents: read
      id-token: write
      pull-requests: read

  sdk-rust:
    name: mpp-rs
    uses: ./.github/workflows/sdk-conformance.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      contents: read
      id-token: write
    with:
      adapter: rust
      sdk-repository: tempoxyz/mpp-rs
      conformance-ref: ${{ github.sha }}

  sdk-python:
    name: pympp
    uses: ./.github/workflows/sdk-conformance.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      contents: read
      id-token: write
    with:
      adapter: python
      sdk-repository: tempoxyz/pympp
      conformance-ref: ${{ github.sha }}

  sdk-go:
    name: mpp-go
    uses: ./.github/workflows/sdk-conformance.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      contents: read
      id-token: write
    with:
      adapter: go
      sdk-repository: tempoxyz/mpp-go
      conformance-ref: ${{ github.sha }}

  sdk-typescript:
    name: mppx
    uses: ./.github/workflows/sdk-conformance.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      contents: read
      id-token: write
    with:
      adapter: typescript
      sdk-repository: wevm/mppx
      conformance-ref: ${{ github.sha }}

  sdk-ruby:
    name: mpp-rb
    uses: ./.github/workflows/sdk-conformance.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      contents: read
      id-token: write
    with:
      adapter: ruby
      sdk-repository: stripe/mpp-rb
      conformance-ref: ${{ github.sha }}

  report-sdks:
    name: report SDK conformance
    runs-on: ubuntu-latest
    needs:
      - sdk-rust
      - sdk-python
      - sdk-go
      - sdk-typescript
      - sdk-ruby
    if: always()
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Mint issue token
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: conformance-monitor
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open, update, or close SDK issues
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          TOOLS_SHA: ${{ github.sha }}
        run: python3 conformance/scripts/report_sdk_conformance.py

  report:
    runs-on: ubuntu-latest
    needs: conformance
    if: always()
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: read
      id-token: write
      issues: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Mint issue token
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: conformance-monitor
      - name: Check existing issues
        id: check-issue
        run: |
          gh label create conformance-failure --color B60205 --description "Daily conformance run failing" --force
          existing=$(gh issue list --label conformance-failure --state open --limit 100 --json number,title -q '[.[] | select(.title | startswith("Conformance tests failing"))][0].number // empty')
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}

      - name: Open or update GitHub issue on failure
        if: needs.conformance.result != 'success'
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          SDK_SUMMARY: ${{ needs.conformance.outputs.sdk_summary }}
          VECTOR_PASSED: ${{ needs.conformance.outputs.vector_passed }}
          VECTOR_FAILED: ${{ needs.conformance.outputs.vector_failed }}
          VECTOR_TOTAL: ${{ needs.conformance.outputs.vector_total }}
          VECTOR_ERRORS: ${{ needs.conformance.outputs.vector_errors }}
          FLOW_STATUS: ${{ needs.conformance.outputs.flow_status }}
          FLOW_ERRORS: ${{ needs.conformance.outputs.flow_errors }}
        run: |
          body=$(cat <<ISSUE_BODY
          ## Conformance tests failing

          **SDK Versions:** ${SDK_SUMMARY:-unknown}
          **Vector Results:** ${VECTOR_PASSED:-0} passed, ${VECTOR_FAILED:-0} failed, ${VECTOR_TOTAL:-0} total
          **Flow Results:** ${FLOW_STATUS:-unknown}
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Vector Failures

          ${VECTOR_ERRORS:-No vector details available.}

          ### Flow Failures

          ${FLOW_ERRORS:-No flow details available.}

          ### Reproduction

          \`\`\`bash
          git clone ${{ github.server_url }}/${{ github.repository }}
          cd mpp-tools
          cd conformance && make install && make test && make flow
          \`\`\`
          ISSUE_BODY
          )

          if [ -n "${{ steps.check-issue.outputs.existing }}" ]; then
            gh issue comment "${{ steps.check-issue.outputs.existing }}" --body "$body"
          else
            gh issue create \
              --title "Conformance tests failing (pinned SDK releases)" \
              --body "$body" \
              --label conformance-failure
          fi

      - name: Close issue on recovery
        if: needs.conformance.result == 'success' && steps.check-issue.outputs.existing != ''
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          SDK_SUMMARY: ${{ needs.conformance.outputs.sdk_summary }}
        run: |
          gh issue close "${{ steps.check-issue.outputs.existing }}" \
            --comment "Conformance tests passing again. SDKs: ${SDK_SUMMARY:-unknown}"
