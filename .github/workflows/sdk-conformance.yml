name: SDK Conformance

on:
  workflow_call:
    inputs:
      adapter:
        description: SDK adapter to test, for example rust, ruby, go, python, or typescript. Java is tested by mpp-tools CI only because local SDK override support is not implemented.
        required: true
        type: string
      conformance-ref:
        description: mpp-tools branch, tag, or SHA to use for the conformance suite.
        required: false
        type: string
        default: main
      run-flows:
        description: Whether to run end-to-end flow and client-server pair tests after vector tests.
        required: false
        type: boolean
        default: true

permissions: {}

env:
  SDK_PATH: ${{ github.workspace }}/sdk

jobs:
  conformance:
    name: ${{ inputs.adapter }} conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mpp-tools/conformance

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Checkout SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk
          persist-credentials: false

      - name: Resolve inputs
        id: resolve
        working-directory: .
        env:
          REQUESTED_ADAPTER: ${{ inputs.adapter }}
          REQUESTED_CONFORMANCE_REF: ${{ inputs.conformance-ref }}
        run: |
          adapter=$(printf '%s' "$REQUESTED_ADAPTER" | tr '[:upper:]' '[:lower:]')
          case "$adapter" in
            go|python|ruby|rust|typescript)
              ;;
            *)
              echo "Unsupported adapter: $REQUESTED_ADAPTER" >&2
              echo "Java is intentionally excluded until use_local_sdk.py can point the Java adapter at a local SDK checkout." >&2
              exit 2
              ;;
          esac

          echo "adapter=$adapter" >> "$GITHUB_OUTPUT"
          echo "conformance_ref=$REQUESTED_CONFORMANCE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout conformance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/mpp-tools
          ref: ${{ steps.resolve.outputs.conformance_ref }}
          path: mpp-tools
          persist-credentials: false

      - name: Setup conformance adapter
        uses: ./mpp-tools/.github/actions/setup-conformance # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          adapter: ${{ steps.resolve.outputs.adapter }}
          conformance-directory: mpp-tools/conformance
          setup-node: "true"
          ruby-bundler-cache: "false"

      - name: Install conformance runner dependencies
        run: make install-runner

      - name: Point adapter at SDK checkout
        run: uv run --locked python scripts/use_local_sdk.py --adapter "$ADAPTER" --sdk-path "$SDK_PATH"
        env:
          ADAPTER: ${{ steps.resolve.outputs.adapter }}

      - name: Enable pnpm for TypeScript SDK checkout
        if: steps.resolve.outputs.adapter == 'typescript'
        id: pnpm
        working-directory: sdk
        run: |
          corepack enable
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Without a store cache every run installed the SDK's dependencies cold
      # through Aegis (~100s). Only the caller's main branch writes the cache.
      - name: Cache TypeScript SDK pnpm store
        if: steps.resolve.outputs.adapter == 'typescript' && github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: conformance-sdk-pnpm-${{ runner.os }}-${{ hashFiles('sdk/pnpm-lock.yaml') }}
          restore-keys: conformance-sdk-pnpm-${{ runner.os }}-

      - name: Restore TypeScript SDK pnpm store
        if: steps.resolve.outputs.adapter == 'typescript' && github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: conformance-sdk-pnpm-${{ runner.os }}-${{ hashFiles('sdk/pnpm-lock.yaml') }}
          restore-keys: conformance-sdk-pnpm-${{ runner.os }}-

      - name: Build TypeScript SDK checkout
        if: steps.resolve.outputs.adapter == 'typescript'
        working-directory: sdk
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm build

      - name: Install adapter dependencies
        run: |
          case "$ADAPTER" in
            go)
              cd adapters/go
              GOTOOLCHAIN=auto go mod download
              ;;
            python)
              cd adapters/python
              uv sync --python 3.12
              ;;
            ruby)
              cd adapters/ruby
              python3 run_adapter.py --build
              ;;
            rust)
              cd adapters/rust
              cargo fetch
              ;;
            typescript)
              npm install
              ;;
            *)
              echo "Unsupported adapter: $ADAPTER" >&2
              exit 2
              ;;
          esac
        env:
          ADAPTER: ${{ steps.resolve.outputs.adapter }}

      - name: Run vector conformance
        run: uv run --locked python scripts/vector_runner.py --adapter "$ADAPTER"
        env:
          ADAPTER: ${{ steps.resolve.outputs.adapter }}

      - name: Run flow conformance
        if: inputs.run-flows
        run: uv run --locked python scripts/flow_runner.py --adapter "$ADAPTER"
        env:
          ADAPTER: ${{ steps.resolve.outputs.adapter }}

      # Pairs the SDK's client and server with themselves and the TypeScript
      # reference; adapters without the capabilities are skipped.
      - name: Run pair conformance
        if: inputs.run-flows
        run: uv run --locked python scripts/pair_runner.py --adapter "$ADAPTER"
        env:
          ADAPTER: ${{ steps.resolve.outputs.adapter }}

      # Server verification runs for every adapter whose manifest declares
      # server.verify; adapters without it are skipped rather than failed.
      - name: Detect server verification support
        id: server-verify
        run: |
          manifest="adapters/$ADAPTER/adapter.json"
          set +e
          jq -e '.capabilities | index("server.verify") != null' "$manifest" > /dev/null
          status=$?
          set -e
          case "$status" in
            0) enabled=true ;;
            1)
              enabled=false
              echo "$ADAPTER does not declare server.verify; skipping server verification conformance."
              ;;
            *)
              echo "Could not read capabilities from $manifest" >&2
              exit "$status"
              ;;
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        env:
          ADAPTER: ${{ steps.resolve.outputs.adapter }}

      - name: Run server verification conformance
        if: steps.server-verify.outputs.enabled == 'true'
        run: uv run --locked python scripts/server_verify_runner.py --adapter "$ADAPTER"
        env:
          ADAPTER: ${{ steps.resolve.outputs.adapter }}

      - name: Write summary
        if: always()
        run: |
          {
            echo "### SDK conformance"
            echo ""
            echo "- Adapter: \`$ADAPTER\`"
            echo "- SDK checkout: \`$SDK_PATH\`"
            echo "- Flow tests: \`${{ inputs.run-flows }}\`"
            echo "- Server verification: \`${{ steps.server-verify.outputs.enabled == 'true' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ADAPTER: ${{ steps.resolve.outputs.adapter }}
