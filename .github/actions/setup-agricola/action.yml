name: Setup Agricola
description: Install the trusted Agricola control plane

inputs:
  project-path:
    description: Path containing Agricola's pyproject.toml
    default: .
  setup-python:
    description: Install the trusted Python runtime before installing Agricola
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ${{ inputs.project-path }}/uv.lock

    - name: Setup uv
      uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      with:
        version: "0.12.11"

    # Install the versions pinned in uv.lock (with hashes) so a newly published
    # dependency release cannot change, or break, the control plane's install.
    - name: Install Agricola
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        requirements="$RUNNER_TEMP/agricola-requirements.txt"
        uv export --project "$PROJECT_PATH" --locked --no-dev --no-emit-project \
          --format requirements.txt --output-file "$requirements"
        python -m pip install --require-hashes -r "$requirements"
        python -m pip install --no-deps "$PROJECT_PATH"
