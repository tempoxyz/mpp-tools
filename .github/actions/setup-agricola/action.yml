name: Setup Agricola
description: Install the trusted Agricola control plane

inputs:
  project-path:
    description: Path containing Agricola's pyproject.toml
    default: .
  setup-python:
    description: Install the trusted Python runtime before installing Agricola
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ${{ inputs.project-path }}/pyproject.toml

    - name: Install Agricola
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
      run: python -m pip install "$PROJECT_PATH"
