name: Setup conformance adapter
description: Install shared toolchains needed by conformance adapter jobs.

inputs:
  adapter:
    description: Adapter to prepare, or all.
    required: true
  conformance-directory:
    description: Path to the conformance directory.
    required: false
    default: conformance
  setup-node:
    description: Install Node.js even when the selected adapter is not TypeScript.
    required: false
    default: "false"
  ruby-bundler-cache:
    description: Enable ruby/setup-ruby bundler cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"

    - name: Install uv
      uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
      with:
        version: "0.9.26"
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: |
          ${{ inputs.conformance-directory }}/uv.lock
          ${{ inputs.conformance-directory }}/adapters/python/uv.lock

    - name: Setup Node.js
      if: inputs.setup-node == 'true' || inputs.adapter == 'typescript' || inputs.adapter == 'all'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24.5"
        cache: npm
        cache-dependency-path: ${{ inputs.conformance-directory }}/package-lock.json

    - name: Setup Rust
      if: inputs.adapter == 'rust' || inputs.adapter == 'all'
      uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e

    - name: Cache Rust dependencies
      if: inputs.adapter == 'rust' || inputs.adapter == 'all'
      uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
      with:
        workspaces: ${{ inputs.conformance-directory }}/adapters/rust -> target

    - name: Setup Go
      if: inputs.adapter == 'go' || inputs.adapter == 'all'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: "1.26.0"
        check-latest: true
        cache-dependency-path: ${{ inputs.conformance-directory }}/adapters/go/go.sum

    - name: Setup Java
      if: inputs.adapter == 'java' || inputs.adapter == 'all'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
        cache-dependency-path: |
          ${{ inputs.conformance-directory }}/adapters/java/*.gradle
          ${{ inputs.conformance-directory }}/adapters/java/gradle.lockfile
          ${{ inputs.conformance-directory }}/adapters/java/gradle/wrapper/gradle-wrapper.properties

    - name: Setup Ruby
      if: inputs.adapter == 'ruby' || inputs.adapter == 'all'
      uses: tempoxyz/gh-actions/vendor/ruby/setup-ruby@b411ce7fe18d0775ae614ad5c4b873c768364979
      with:
        ruby-version: "3.3"
        bundler-cache: ${{ inputs.ruby-bundler-cache }}
        working-directory: ${{ inputs.conformance-directory }}/adapters/ruby
