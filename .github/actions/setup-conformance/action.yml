f91fffa7f20fa7e8d7e1a4d795031205f559822e
name: Setup conformance adapter
description: Install shared toolchains needed by conformance adapter jobs.

inputs:
  adapter:
    description: Adapter to prepare, or all.
    required: true
  conformance-directory:
    description: Path to the conformance directory.
    required: false
    default: conformance
  setup-node:
    description: Install Node.js even when the selected adapter is not TypeScript.
    required: false
    default: "false"
  ruby-bundler-cache:
    description: Enable ruby/setup-ruby bundler cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"

    - name: Install uv
      uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      with:
        version: "0.12.11"
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: |
          ${{ inputs.conformance-directory }}/uv.lock
          ${{ inputs.conformance-directory }}/adapters/python/uv.lock

    - name: Setup Node.js
      if: inputs.setup-node == 'true' || inputs.adapter == 'typescript' || inputs.adapter == 'all'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: "24.22.1"
        cache: npm
        cache-dependency-path: ${{ inputs.conformance-directory }}/package-lock.json

    - name: Setup Rust
      if: inputs.adapter == 'rust' || inputs.adapter == 'all'
      uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

    - name: Cache Rust dependencies
      if: inputs.adapter == 'rust' || inputs.adapter == 'all'
      uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      with:
        workspaces: ${{ inputs.conformance-directory }}/adapters/rust -> target

    - name: Setup Go
      if: inputs.adapter == 'go' || inputs.adapter == 'all'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: "1.26.10"
        check-latest: true
        cache-dependency-path: ${{ inputs.conformance-directory }}/adapters/go/go.sum

    - name: Setup Java
      if: inputs.adapter == 'java' || inputs.adapter == 'all'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: "17.0.21+9"
        check-latest: true
        cache: gradle
        cache-dependency-path: |
          ${{ inputs.conformance-directory }}/adapters/java/*.gradle
          ${{ inputs.conformance-directory }}/adapters/java/gradle.lockfile
          ${{ inputs.conformance-directory }}/adapters/java/gradle/wrapper/gradle-wrapper.properties

    # The secure runner's Aegis proxy re-signs TLS with its own CA. Node, curl
    # and the other toolchains read /etc/aegis/bundle.pem; the JDK only trusts
    # its own cacerts, so Gradle cannot reach Maven Central without this.
    - name: Trust the runner TLS proxy CA in Java
      if: inputs.adapter == 'java' || inputs.adapter == 'all'
      shell: bash
      run: |
        bundle=/etc/aegis/bundle.pem
        if [[ ! -f "$bundle" ]]; then
          exit 0
        fi
        certs="$(mktemp -d)"
        awk -v dir="$certs" '/BEGIN CERTIFICATE/ { n++ } n { print > (dir "/cert-" n ".pem") }' "$bundle"
        for cert in "$certs"/cert-*.pem; do
          "$JAVA_HOME/bin/keytool" -importcert -noprompt -cacerts -storepass changeit \
            -alias "aegis-$(basename "$cert" .pem)" -file "$cert" > /dev/null
        done

    - name: Setup Ruby
      if: inputs.adapter == 'ruby' || inputs.adapter == 'all'
      uses: tempoxyz/gh-actions/vendor/ruby/setup-ruby@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      with:
        ruby-version: "3.3"
        bundler-cache: ${{ inputs.ruby-bundler-cache }}
        working-directory: ${{ inputs.conformance-directory }}/adapters/ruby
