[package]
name = "mpp-conformance-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "adapter"
path = "src/main.rs"

[dependencies]
mpp = { git = "https://github.com/tempoxyz/mpp-rs", rev = "b0e189c6390774445dd356fd78575100c22ddcd3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
