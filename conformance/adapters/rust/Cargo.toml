[package]
name = "mpp-conformance-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "adapter"
path = "src/main.rs"

[dependencies]
mpp = { version = "=0.11.0", features = ["client"] }
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
tokio = { version = "1", features = ["rt"] }
