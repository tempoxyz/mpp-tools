[package]
name = "mpp-conformance-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "adapter"
path = "src/main.rs"

[dependencies]
mpp = { git = "https://github.com/tempoxyz/mpp-rs", rev = "d171cc3d9f491205b2d523eb38c6e5375a317eaf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
