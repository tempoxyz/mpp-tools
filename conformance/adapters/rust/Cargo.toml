[package]
name = "mpp-conformance-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "adapter"
path = "src/main.rs"

[dependencies]
mpp = { git = "https://github.com/tempoxyz/mpp-rs", rev = "d9db42d243ba7552695d67ab141e61fae8010251", features = ["client", "server", "stripe", "tempo", "tower"] }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
http = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt"] }
tower-layer = "0.3"
tower-service = "0.3"
